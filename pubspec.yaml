name: custom_cursor
description: >-
  Custom mouse cursors for Flutter on desktop, web, and Android. Decodes
  Windows .cur/.ani resources, Linux Xcursor themes, and raster images, and
  displays them through MouseRegion.
version: 0.1.0
publish_to: "none"

environment:
  sdk: ^3.13.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  web: ^1.1.0

dev_dependencies:
  arcane_analysis: ^1.0.5
  flutter_test:
    sdk: flutter
  test: ^1.31.1

flutter:
  plugin:
    platforms:
      macos:
        pluginClass: CustomCursorPlugin
      windows:
        pluginClass: CustomCursorPlugin
      linux:
        pluginClass: CustomCursorPlugin
      web:
        pluginClass: CustomCursorWeb
        fileName: web/custom_cursor_web.dart
      android:
        package: com.hanskokx.custom_cursor
        pluginClass: CustomCursorPlugin
